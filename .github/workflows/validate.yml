name: Validate skills and agents

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Validate portable agents
        run: python scripts/validate_agents.py
      - name: Test agent manifest and export
        run: python scripts/test_validate_agents.py
      - name: Test agent handoffs
        run: python scripts/test_validate_agent_handoff.py
      - name: Smoke-test portable export
        run: python scripts/export_agent_bundle.py --format json --output /tmp/reporting-agents.json
      - name: Test report validator
        run: python write-vulnerability-report/scripts/test_validate_report.py
      - name: Test review validator
        run: python review-vulnerability-report/scripts/test_validate_review.py
      - name: Test hardening validator
        run: python harden-vulnerability-report/scripts/test_validate_hardening.py
      - name: Test adaptation validator
        run: python adapt-vulnerability-report/scripts/test_validate_adaptation.py
