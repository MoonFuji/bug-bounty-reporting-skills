name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate repository structure
        run: python scripts/validate_repo.py
      - name: Test report validator
        run: python write-vulnerability-report/scripts/test_validate_report.py
      - name: Test review validator
        run: python review-vulnerability-report/scripts/test_validate_review.py
      - name: Test hardening validator
        run: python harden-vulnerability-report/scripts/test_validate_hardening.py
      - name: Test adaptation validator
        run: python adapt-vulnerability-report/scripts/test_validate_adaptation.py
      - name: Validate security coaching package
        run: python security-evidence-coach/scripts/practice.py validate
      - name: Test offline practice tools
        run: python security-evidence-coach/scripts/test_practice.py
      - name: Test defensive teaching models
        run: python security-evidence-coach/labs/test_models.py
      - name: Validate advanced coaching package
        run: python security-evidence-coach/scripts/practice.py validate --suite advanced
      - name: Test advanced offline practice
        run: python security-evidence-coach/scripts/test_advanced.py
      - name: Test evidence arithmetic
        run: python security-evidence-coach/labs/test_evidence_math.py
      - name: Validate architecture assessment projects
        run: python security-evidence-coach/scripts/assessment_projects.py validate
      - name: Test architecture project exports and teaching contracts
        run: python security-evidence-coach/scripts/test_assessment_projects.py
      - name: Validate mobile hunter skill
        run: python mobile-app-hunter/scripts/mobile_projects.py validate
      - name: Validate mobile research provenance
        run: python mobile-app-hunter/scripts/validate_research.py
      - name: Test mobile hunter offline tooling
        run: python -m unittest discover -s mobile-app-hunter/scripts -p 'test_*.py'
