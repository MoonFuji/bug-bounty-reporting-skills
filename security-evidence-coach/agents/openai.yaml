interface:
  display_name: "Security Evidence Coach"
  short_description: "Architecture-first security assessment and evidence judgment"
  default_prompt: >-
    Use $security-evidence-coach to investigate the designated codebase even when
    no suspected bug is supplied. Reconstruct security responsibilities, derive
    material architecture-specific questions, and ground conclusions in active
    bindings and supplied evidence. Load mechanism lessons only as needed and
    preserve unresolved dependencies without inventing tests or report readiness.
